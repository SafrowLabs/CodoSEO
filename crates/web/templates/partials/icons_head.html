{#- Icons and browser colour for every page. Light is the default whatever the OS prefers, so
    app.js points both theme colours at the theme in use unless "system" is chosen. -#}
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="{{ crate::assets::url("favicon.svg") }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#efefea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1411" media="(prefers-color-scheme: dark)">
