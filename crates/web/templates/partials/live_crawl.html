<div class="live-crawl">
  <dl class="live-stats">
    {% for s in stats %}<div><dt>{{ s.label }}</dt><dd class="num {{ s.class }}">{{ s.value }}</dd></div>{% endfor %}
  </dl>
  {% if pages.is_empty() %}
  <p class="muted live-empty">The first pages show up here in a moment.</p>
  {% else %}
  <ol class="live-pages" aria-label="Newest pages, newest first" aria-live="off">
    {% for p in pages %}<li{% if let Some(d) = p.delay_ms %} class="is-new" style="animation-delay:{{ d }}ms"{% endif %}><span class="code {{ p.tone }}">{{ p.status }}</span><span class="trunc mono" title="{{ p.url }}">{{ p.path }}</span></li>{% endfor %}
  </ol>
  {% endif %}
  <noscript><p class="faint live-empty">Reload the page to see the newest pages.</p></noscript>
</div>
