{#- Search and social tags for the public pages (the landing and bot pages). `base` is the
    origin, `path` the page's path. The share image has a fixed URL (`/og.png`), so a card
    shared before a deploy keeps its picture. -#}
{% macro social(base, path, title, description) -%}
<link rel="canonical" href="{{ base }}{{ path }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ base }}{{ path }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:site_name" content="CodoSEO">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="{{ base }}/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The CodoSEO mascot, two watchful eyes, beside the words: Know the moment your SEO breaks.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ base }}/og.png">
<meta name="twitter:image:alt" content="The CodoSEO mascot, two watchful eyes, beside the words: Know the moment your SEO breaks.">
{%- endmacro %}
