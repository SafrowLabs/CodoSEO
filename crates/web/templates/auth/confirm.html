{% extends "solo_base.html" %}
{%- import "partials/mascot.html" as m -%}
{% block title %}Signing in — CodoSEO{% endblock %}
{% block body %}
<div class="solo-page">
  <form class="solo-card" method="post" action="/auth/magic/{{ token }}" id="confirm">
    <div class="solo-mascot">{% call m::tile() %}{% endcall %}</div>
    <h1>Signing you in…</h1>
    <p>One moment. If nothing happens, press the button.</p>
    <div class="actions"><button class="btn btn-primary btn-lg" type="submit"><span class="spinner on"></span>Continue to CodoSEO</button></div>
  </form>
</div>
<script>setTimeout(function(){document.getElementById("confirm").requestSubmit()},350)</script>
{% endblock %}
