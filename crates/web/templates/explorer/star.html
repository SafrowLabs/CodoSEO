<button type="button" class="star{% if on %} on{% endif %}{% if pop %} pop{% endif %}" data-star="{{ hex }}" name="hash" value="{{ hex }}" hx-post="{{ base }}/key-pages?at={{ at }}" hx-target="this" hx-swap="outerHTML" hx-include="this" hx-on:click="event.stopPropagation()" aria-pressed="{{ on }}" aria-label="{% if on %}Remove from key pages{% else %}Mark as a key page{% endif %}"><svg class="icon" style="width:14px;height:14px"><use href="#i-star"/></svg></button>
