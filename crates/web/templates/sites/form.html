<form id="add-site" class="add-site" method="post" action="/sites" hx-disabled-elt="find button">
  <div class="field">
    <input class="input input-lg" name="url" value="{{ url }}" placeholder="example.com" aria-label="Site address" autocomplete="url" {% if first %}autofocus{% endif %} required{% if !can_add %} disabled{% endif %}>
    {% if let Some(err) = error %}<span class="error-text"><svg class="icon" style="width:14px;height:14px"><use href="#i-alert"/></svg>{{ err }}</span>{% endif %}
  </div>
  <button class="btn btn-primary btn-lg" type="submit"{% if !can_add %} disabled{% endif %}><span class="play"></span>{% if first %}Start first crawl{% else %}Add site{% endif %}</button>
</form>
