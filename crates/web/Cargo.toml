[package]
name = "codoseo-web"
description = "The CodoSEO web app: axum routes, askama templates and htmx partials."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**/*", "templates/**/*", "assets/**/*", "askama.toml", "Cargo.toml"]

[dependencies]
codoseo-core.workspace = true
codoseo-checks.workspace = true
codoseo-store.workspace = true
axum = { workspace = true, features = ["macros"] }
askama.workspace = true
askama_web.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
uuid.workspace = true
url.workspace = true
thiserror.workspace = true
xxhash-rust.workspace = true
flate2.workspace = true
sha2.workspace = true
rand.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["json", "form"] }
futures-util.workspace = true
bytes.workspace = true
csv.workspace = true

[dev-dependencies]
tower.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
