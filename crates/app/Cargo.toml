[package]
name = "codoseo"
description = "CodoSEO: a fast, polite SEO crawler and site auditor for the command line."
readme = "../../README.md"
keywords = ["seo", "crawler", "audit", "cli", "mcp"]
categories = ["command-line-utilities", "web-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "codoseo"
path = "src/main.rs"

[dependencies]
codoseo-core.workspace = true
codoseo-crawler.workspace = true
codoseo-checks.workspace = true
codoseo-diff.workspace = true
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
codoseo-testkit.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
insta = { workspace = true, features = ["filters"] }

[lints]
workspace = true
