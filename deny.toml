# cargo-deny policy. Run with `cargo deny check` (CI runs it on every push, nightly runs it too so
# a new advisory against an unchanged lockfile shows up without a commit).

[graph]
# Every platform we ship binaries for pulls its own dependencies in (windows-sys, security-framework);
# check them all instead of only the host's.
all-features = true

[advisories]
# Unmaintained and yanked crates are surfaced as warnings by default; vulnerabilities are errors.
version = 2
yanked = "deny"
ignore = []

[licenses]
# CodoSEO is AGPL-3.0-only. Everything below is permissive and compatible with shipping it in an
# AGPL-3.0 binary. Derived from `cargo deny list`; a new license showing up fails CI so someone
# looks at it.
version = 2
confidence-threshold = 0.9
allow = [
    "AGPL-3.0-only", # our own crates
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",         # cssparser, selectors (file-level copyleft, fine as unmodified dependencies)
    "CDLA-Permissive-2.0", # webpki-roots (CA certificate bundle)
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path dependencies (testkit has no version)
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
