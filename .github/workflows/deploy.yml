name: deploy

# Every push to main that touches the app builds one linux/amd64 image, pushes it to ghcr.io as
# `:main` and `:sha-<short>`, then has Coolify pull that exact tag and redeploy. Coolify builds
# nothing; the resource runs deploy/compose.cloud.yml with CODOSEO_VERSION pinned per deploy, so a
# rollback is setting CODOSEO_VERSION back to an older `sha-…` tag in Coolify and redeploying.
#
# No release artefacts here (other architectures, binaries, crates, npm, Homebrew): that is
# release.yml, run by hand. Secrets: COOLIFY_URL (https://host.safrow.com), COOLIFY_TOKEN (API token
# with deploy and write access), COOLIFY_APP_UUID. Without them the image is still pushed and the
# deploy step is skipped. See docs/deploy-coolify.md, "Auto-deploy from main".

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push supersedes a build still running; the deploy itself is quick.
concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/safrowlabs/codoseo

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main-${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=deploy-amd64
          cache-to: type=gha,mode=max,scope=deploy-amd64

      - name: Deploy on Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP: ${{ secrets.COOLIFY_APP_UUID }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$APP" ]; then
            echo "::notice::Coolify secrets not set; pushed $IMAGE:$TAG but did not deploy."
            exit 0
          fi
          api() { curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Content-Type: application/json" "$@"; }
          base="${COOLIFY_URL%/}/api/v1"

          # Pin the tag the compose file pulls (${CODOSEO_VERSION:-latest}); a new tag always pulls.
          body="$(jq -nc --arg v "$TAG" '{key: "CODOSEO_VERSION", value: $v}')"
          api -X PATCH "$base/applications/$APP/envs" -d "$body" >/dev/null \
            || api -X POST "$base/applications/$APP/envs" -d "$body" >/dev/null

          dep="$(api "$base/deploy?uuid=$APP&force=false" | jq -r '.deployments[0].deployment_uuid')"
          echo "Coolify deployment $dep for $TAG"

          # Wait for Coolify to finish (pull, migrate, restart), up to 15 minutes.
          for _ in $(seq 90); do
            status="$(api "$base/deployments/$dep" | jq -r '.status')"
            case "$status" in
              finished) echo "Deployed $TAG"; exit 0 ;;
              failed|cancelled*) echo "::error::Coolify deployment $dep ended: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Coolify deployment $dep still '$status' after 15 minutes"
          exit 1
