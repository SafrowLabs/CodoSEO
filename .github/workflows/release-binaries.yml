name: release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: codoseo
          - os: macos-13
            target: x86_64-apple-darwin
            binary: codoseo
          - os: macos-14
            target: aarch64-apple-darwin
            binary: codoseo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: codoseo.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build binary
        run: cargo build --locked --release -p codoseo --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p staging
          cp "target/${TARGET}/release/${BINARY}" "staging/${BINARY}"
          tar -czf "codoseo-${TAG}-${TARGET}.tar.gz" -C staging "${BINARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: codoseo-${{ matrix.target }}
          path: codoseo-*.tar.gz

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: codoseo-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/codoseo-*.tar.gz
