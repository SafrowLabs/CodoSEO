[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/SafrowLabs/codoSEO"
homepage = "https://codoseo.com"

[workspace.dependencies]
codoseo-core = { path = "crates/core", version = "0.0.1" }
codoseo-crawler = { path = "crates/crawler", version = "0.0.1" }
codoseo-checks = { path = "crates/checks", version = "0.0.1" }
codoseo-diff = { path = "crates/diff", version = "0.0.1" }
codoseo-mcp = { path = "crates/mcp", version = "0.0.1" }
codoseo-store = { path = "crates/store", version = "0.0.1" }
codoseo-web = { path = "crates/web", version = "0.0.1" }
codoseo-notify = { path = "crates/notify", version = "0.0.1" }
codoseo-testkit = { path = "crates/testkit" }
url = { version = "2.5.8", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
proptest = "1.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "stream"] }
bytes = "1.12.1"
http = "1.5.0"
futures-util = "0.3.34"
httpdate = "1.0.3"
axum = "0.8.9"
flate2 = "1.1.10"
lol_html = "3.0.1"
encoding_rs = "0.8.42"
htmlize = { version = "1.1.0", features = ["unescape"] }
quick-xml = "0.42.0"
peak_alloc = "0.3.0"
clap = { version = "4.6.0", features = ["derive"] }
csv = "1.4.0"
assert_cmd = "2.2.0"
predicates = "3.1.0"
tempfile = "3.27.0"
insta = { version = "1.49.0", features = ["yaml"] }
rmcp = { version = "3.5.0", features = ["transport-io"] }
schemars = "1.1.0"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7.0.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "time", "uuid"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
sha2 = "0.11.0"
rand = "0.10.3"
base64 = "0.23.1"
tower = { version = "0.5.3", features = ["util"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }
aes-gcm = "0.11.1"
hmac = "0.13.0"
hex = "0.4.3"
jiff = { version = "0.2.37", default-features = false, features = ["std", "tzdb-bundle-always"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# The profile the container image and release binaries are built with. Thin LTO plus one codegen
# unit shrinks and speeds up the binary; symbols are stripped. Day-to-day `cargo build --release`
# is unaffected.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
